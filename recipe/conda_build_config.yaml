# The C++ test suite (GBS_BUILD_TESTS) uses std::to_chars / std::format on
# doubles (C++20). Those libc++ symbols are gated as "available starting
# macOS 13.4", so with the default conda-forge osx-64 deployment target the
# tests fail to compile with:
#   error: 'to_chars' is unavailable: introduced in macOS 13.4
# gbs' own CI pins macos-13 (Intel) for the same reason. Raise the deployment
# target to 13.4 on macOS only -- the conda SDK already ships the symbols, so
# only the availability floor (-mmacosx-version-min) needs bumping.
MACOSX_DEPLOYMENT_TARGET:  # [osx]
  - "13.4"                 # [osx]
